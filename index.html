<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>だちゃっと — DaChat</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <div class="logo-japanese">だちゃっと</div>
                <div class="logo-english">DaChat</div>
            </div>

            <div class="server-section">

                <button class="nav-item active">
                    <span>🌎</span>
                    Global Chat
                </button>

                <button class="nav-item">
                    <span>💬</span>
                    Direct Messages
                </button>

                <button class="nav-item">
                    <span>👥</span>
                    Groups
                </button>

            </div>

            <div class="sidebar-bottom">

                <div class="user-card">

                    <div class="avatar">
                        ?
                    </div>

                    <div class="user-info">
                        <strong>Guest</strong>
                        <span>Not logged in</span>
                    </div>

                </div>

            </div>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main">

            <!-- HEADER -->
            <header class="chat-header">

                <div>
                    <h1>
                        <span>#</span> Global Chat
                    </h1>

                    <p>
                        Talk with everyone on DaChat
                    </p>
                </div>

            </header>


            <!-- MESSAGES -->
            <section class="messages">

                <div class="welcome">

                    <div class="welcome-icon">
                        💬
                    </div>

                    <h2>
                        Welcome to DaChat!
                    </h2>

                    <p>
                        This is the beginning of the Global Chat.
                    </p>

                </div>

            </section>


            <!-- MESSAGE BOX -->
            <form class="message-form">

                <input
                    type="text"
                    placeholder="Message Global Chat..."
                    maxlength="1000"
                >

                <button type="submit">
                    Send
                </button>

            </form>

        </main>

    </div>

</body>
</html>
